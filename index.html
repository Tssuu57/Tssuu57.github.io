<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>雨夜 · 日式便利店街角</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060912; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 基础环境
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060912);
scene.fog = new THREE.Fog(0x060912, 28, 56);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 300);
camera.position.set(12.5, 10.5, 14.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 8;
controls.maxDistance = 36;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =========================================================
   1. 三渲二 材质系统
   ========================================================= */
const TOON_RAMP = (() => {
  const data = new Uint8Array([70, 130, 200, 255]);
  const t = new THREE.DataTexture(data, data.length, 1, THREE.RedFormat);
  t.needsUpdate = true;
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
})();

const toon = (color, extra = {}) =>
  new THREE.MeshToonMaterial({ color, gradientMap: TOON_RAMP, ...extra });

const glow = (color, extra = {}) => new THREE.MeshBasicMaterial({ color, ...extra });

/* 画布贴图工具 */
function makeTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* =========================================================
   2. 光照
   ========================================================= */
scene.add(new THREE.AmbientLight(0x4a5f9e, 0.55));
scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x2a1f3a, 0.55));

const moon = new THREE.DirectionalLight(0x9ab8ff, 1.0);
moon.position.set(9, 15, 11);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
const sc = moon.shadow.camera;
sc.left = -10; sc.right = 10; sc.top = 10; sc.bottom = -10;
sc.near = 1; sc.far = 45;
moon.shadow.bias = -0.0012;
moon.shadow.normalBias = 0.02;
scene.add(moon);

/* =========================================================
   3. 组装动画注册系统
   ========================================================= */
const ROOT = new THREE.Group();
scene.add(ROOT);

const assembly = [];
let cursor = 0;

function reg(obj, step = 0.035, dur = 0.85) {
  cursor += step;
  assembly.push({ obj, delay: cursor, dur });
  ROOT.add(obj);
  return obj;
}

/* 快捷建盒 */
const B = (w, h, d, color, opts = {}) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(color, opts.mat || {}));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
};
const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };

/* =========================================================
   4. 底座 / 地面
   ========================================================= */
// 底座台阶
const plinth = new THREE.Mesh(
  new THREE.BoxGeometry(11.9, 0.3, 11.9),
  toon(0x131a2b)
);
plinth.position.y = -0.95;
plinth.receiveShadow = true;
reg(plinth, 0.02, 1.0);

// 主体底座
const baseBlock = new THREE.Mesh(
  new THREE.BoxGeometry(11, 0.8, 11),
  toon(0x25304a)
);
baseBlock.position.y = -0.4;
baseBlock.castShadow = true;
baseBlock.receiveShadow = true;
reg(baseBlock, 0.03, 1.0);

// 沥青地面
const asphalt = new THREE.Mesh(
  new THREE.PlaneGeometry(11, 11),
  toon(0x1a2133)
);
asphalt.rotation.x = -Math.PI / 2;
asphalt.position.y = 0.004;
asphalt.receiveShadow = true;
reg(asphalt, 0.02, 0.8);

// 人行道（L 形：x[-5.4,1.2] z[-5.4,1.2]）
const walk = new THREE.Mesh(
  new THREE.BoxGeometry(6.6, 0.14, 6.6),
  toon(0x3a4360)
);
walk.position.set(-2.1, 0.07, -2.1);
walk.castShadow = true;
walk.receiveShadow = true;
reg(walk, 0.05, 0.9);

/* 路缘石高光条 */
const curbFront = new THREE.Mesh(
  new THREE.BoxGeometry(6.6, 0.05, 0.1),
  toon(0x5a6a92)
);
curbFront.position.set(-2.1, 0.145, 1.17);
reg(curbFront, 0.02);

const curbSide = new THREE.Mesh(
  new THREE.BoxGeometry(0.1, 0.05, 6.6),
  toon(0x5a6a92)
);
curbSide.position.set(1.17, 0.145, -2.1);
reg(curbSide, 0.02);

/* =========================================================
   5. 路面标线 / 斑马线 / 停车位 / 积水
   ========================================================= */
const lineMat = new THREE.MeshBasicMaterial({ color: 0xd8e4f5 });
const lineMatDim = new THREE.MeshBasicMaterial({ color: 0x9fb0cc });

// 斑马线（横穿前侧马路）
for (let i = 0; i < 5; i++) {
  const st = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 3.4), lineMatDim);
  st.rotation.x = -Math.PI / 2;
  st.position.set(-3.5 + i * 0.86, 0.012, 3.3);
  reg(st, 0.03);
}

// 侧街斑马线
for (let i = 0; i < 4; i++) {
  const st = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 0.42), lineMatDim);
  st.rotation.x = -Math.PI / 2;
  st.position.set(3.6, 0.012, -2.6 + i * 0.86);
  reg(st, 0.03);
}

// 路边白线
const edge1 = new THREE.Mesh(new THREE.PlaneGeometry(11, 0.08), lineMat);
edge1.rotation.x = -Math.PI / 2;
edge1.position.set(0, 0.012, 1.42);
reg(edge1, 0.02);

const edge2 = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 11), lineMat);
edge2.rotation.x = -Math.PI / 2;
edge2.position.set(1.42, 0.012, 0);
reg(edge2, 0.02);

// 停车位
for (let i = 0; i < 3; i++) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 2.2), lineMat);
  p.rotation.x = -Math.PI / 2;
  p.position.set(2.4 + i * 1.05, 0.012, 4.2);
  reg(p, 0.025);
}
const pBack = new THREE.Mesh(new THREE.PlaneGeometry(3.15, 0.06), lineMat);
pBack.rotation.x = -Math.PI / 2;
pBack.position.set(3.45, 0.012, 5.3);
reg(pBack, 0.025);

// 积水（反光水洼）
const puddleMat = new THREE.MeshBasicMaterial({
  color: 0x33507f, transparent: true, opacity: 0.55, depthWrite: false
});
const puddleGeo = new THREE.CircleGeometry(1, 18);
[[-2.4, 2.2, 0.85], [0.6, 3.6, 1.1], [-4.4, 3.9, 0.7], [3.2, -0.8, 0.95], [-0.6, 0.4, 0.55]]
  .forEach(([x, z, s], i) => {
    const p = new THREE.Mesh(puddleGeo, puddleMat);
    p.rotation.x = -Math.PI / 2;
    p.scale.set(s, s * 0.62, 1);
    p.position.set(x, 0.014, z);
    reg(p, 0.03);
  });

/* 排水沟格栅 */
for (let i = 0; i < 5; i++) {
  const gr = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.03, 0.28), toon(0x141a26));
  gr.position.set(-4.6 + i * 1.15, 0.15, 1.02);
  reg(gr, 0.025);
}

/* =========================================================
   6. 便利店主体
   ========================================================= */
const S = {
  x0: -5.4, x1: -0.7,
  z0: -4.6, z1: -0.9,
  y0: 0.14, h: 3.1
};
const cx = (S.x0 + S.x1) / 2;   // -3.05
const cz = (S.z0 + S.z1) / 2;   // -2.75
const wallColor = 0xe6e3d8;

// 后墙
reg(at(B(4.7, S.h, 0.14, wallColor), cx, S.y0 + S.h / 2, S.z0 + 0.07), 0.05, 1.0);
// 左墙
reg(at(B(0.14, S.h, 3.7, wallColor), S.x0 + 0.07, S.y0 + S.h / 2, cz), 0.05, 1.0);
// 右墙
reg(at(B(0.14, S.h, 3.7, wallColor), S.x1 - 0.07, S.y0 + S.h / 2, cz), 0.05, 1.0);

// 前墙 - 基座
reg(at(B(4.7, 0.22, 0.14, 0xd8d4c6), cx, 0.25, S.z1), 0.04);
// 前墙 - 上楣
reg(at(B(4.7, 0.84, 0.14, wallColor), cx, 2.82, S.z1), 0.04);

// 前墙 - 立柱
reg(at(B(0.14, 2.04, 0.14, 0xd8d4c6), S.x0 + 0.07, 1.38, S.z1), 0.04);
reg(at(B(0.14, 2.04, 0.14, 0xd8d4c6), -2.10, 1.38, S.z1), 0.04);
reg(at(B(0.14, 2.04, 0.14, 0xd8d4c6), S.x1 - 0.07, 1.38, S.z1), 0.04);

// 屋顶封边
reg(at(B(4.86, 0.1, 3.86, 0xcfcabb), cx, 3.29, cz), 0.03);

/* 玻璃 */
const glassMat = new THREE.MeshBasicMaterial({
  color: 0xa8dcff, transparent: true, opacity: 0.13,
  side: THREE.DoubleSide, depthWrite: false
});

const winGlass = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 2.04), glassMat);
winGlass.position.set(-3.71, 1.38, S.z1);
reg(winGlass, 0.06);

const doorGlass = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.04), glassMat);
doorGlass.position.set(-1.43, 1.38, S.z1);
reg(doorGlass, 0.06);

/* 玻璃分隔线（竖框） */
const mullionMat = toon(0xb9b4a6);
reg(at(B(0.05, 2.04, 0.06, 0xb9b4a6), -3.71, 1.38, S.z1), 0.02);
reg(at(B(3.1, 0.05, 0.06, 0xb9b4a6), -3.71, 1.38, S.z1), 0.02);

/* 自动门框 + 门缝 */
const doorFrameMat = toon(0x8d94a8);
reg(at(B(0.07, 2.04, 0.08, 0x8d94a8), -1.43, 1.38, S.z1), 0.02);
reg(at(B(0.06, 0.9, 0.09, 0x5f6678), -2.00, 1.30, S.z1 - 0.01), 0.02); // 门把手

/* 自动门上的 OPEN 灯牌 */
const openTex = makeTexture(256, 128, (g, w, h) => {
  g.fillStyle = '#0b1220'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#61ffb0';
  g.font = 'bold 62px "Arial Black", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('OPEN', w / 2, h / 2);
});
const openSign = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.3),
  new THREE.MeshBasicMaterial({ map: openTex, transparent: true })
);
openSign.position.set(-1.43, 2.12, S.z1 + 0.02);
reg(openSign, 0.02);

/* =========================================================
   7. 招牌 + 雨棚
   ========================================================= */
const signTex = makeTexture(1024, 200, (g, w, h) => {
  g.fillStyle = '#fbfaf5'; g.fillRect(0, 0, w, h);
  const cols = ['#3fae63', '#3b8ad9', '#f0a02e'];
  cols.forEach((c, i) => {
    g.fillStyle = c;
    g.fillRect(34, 34 + i * 44, 116, 30);
  });
  g.fillStyle = '#1f3556';
  g.font = 'bold 104px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  g.fillText('ほっとマート', 190, h / 2 + 4);

  g.fillStyle = '#e8503a';
  g.font = 'bold 52px sans-serif';
  g.textAlign = 'right';
  g.fillText('24H', w - 34, h / 2 + 4);
});

const signBox = B(4.7, 0.8, 0.22, 0xf7f6f0);
signBox.position.set(cx, 2.80, S.z1 + 0.06);
reg(signBox, 0.06, 1.0);

const signFace = new THREE.Mesh(
  new THREE.PlaneGeometry(4.6, 0.7),
  new THREE.MeshBasicMaterial({ map: signTex })
);
signFace.position.set(cx, 2.80, S.z1 + 0.175);
reg(signFace, 0.04);

// 招牌下沿灯带
const signLightBar = new THREE.Mesh(
  new THREE.BoxGeometry(4.5, 0.04, 0.04),
  glow(0xfff0c8)
);
signLightBar.position.set(cx, 2.40, S.z1 + 0.18);
reg(signLightBar, 0.03);

/* 雨棚 */
const awning = B(4.8, 0.07, 0.72, 0xdcd8c9);
awning.position.set(cx, 2.38, S.z1 + 0.36);
reg(awning, 0.05);
const awningLip = B(4.8, 0.12, 0.06, 0x9aa3b8);
awningLip.position.set(cx, 2.34, S.z1 + 0.70);
reg(awningLip, 0.03);

/* =========================================================
   8. 店内（透过玻璃可清楚看到）
   ========================================================= */
// 地板
reg(at(B(4.4, 0.06, 3.4, 0xe8dfc8), cx, 0.17, cz), 0.05);
// 天花板
reg(at(B(4.4, 0.08, 3.4, 0xf2efe6), cx, 3.14, cz), 0.04);

// 天花板灯板
const panelMat = glow(0xfff8e6);
[-4.2, -3.05, -1.9].forEach((x, i) => {
  const p = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.42), panelMat);
  p.position.set(x, 3.08, cz + (i - 1) * 0.85);
  reg(p, 0.03);
});

// 店内暖光
const inLight = new THREE.PointLight(0xffe3b0, 14, 11, 2);
inLight.position.set(-3.0, 2.65, -2.5);
ROOT.add(inLight);

const inLight2 = new THREE.PointLight(0xffd9a0, 8, 9, 2);
inLight2.position.set(-1.8, 2.2, -1.6);
ROOT.add(inLight2);

/* --- 后墙：冷藏柜 --- */
const fridgeTex = makeTexture(512, 512, (g, w, h) => {
  g.fillStyle = '#0d1a2e'; g.fillRect(0, 0, w, h);
  const cols = ['#ff6b6b', '#ffd93d', '#4d96ff', '#6bcb77', '#ff9f43', '#c58bff'];
  for (let r = 0; r < 5; r++) {
    const y = 70 + r * 92;
    g.fillStyle = '#e8f6ff';
    g.fillRect(8, y, w - 16, 7);
    for (let i = 0; i < 12; i++) {
      g.fillStyle = cols[(i + r) % cols.length];
      g.fillRect(16 + i * 41, y - 56, 28, 52);
    }
  }
  g.fillStyle = 'rgba(150,220,255,0.10)';
  g.fillRect(0, 0, w, h);
});

const fridgeBody = B(1.9, 2.15, 0.6, 0x2a3242);
fridgeBody.position.set(-4.15, 1.22, -4.24);
reg(fridgeBody, 0.06);

const fridgeFace = new THREE.Mesh(
  new THREE.PlaneGeometry(1.8, 2.05),
  new THREE.MeshBasicMaterial({ map: fridgeTex })
);
fridgeFace.position.set(-4.15, 1.22, -3.935);
reg(fridgeFace, 0.04);

// 冷藏柜冷光
const coldLight = new THREE.PointLight(0x9fdcff, 6, 5, 2);
coldLight.position.set(-4.15, 1.6, -3.6);
ROOT.add(coldLight);

/* --- 左墙：货架 --- */
const shelfX = -5.18;
for (let r = 0; r < 4; r++) {
  const y = 0.62 + r * 0.52;
  const board = B(0.42, 0.04, 2.9, 0xcfcabb);
  board.position.set(shelfX, y, -2.9);
  reg(board, 0.03);

  // 货架商品
  const colors = [0xff7b72, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xff9f43, 0xf3f3f3, 0xc58bff];
  for (let i = 0; i < 11; i++) {
    const c = colors[Math.floor(Math.random() * colors.length)];
    const gw = 0.1 + Math.random() * 0.05;
    const gh = 0.12 + Math.random() * 0.14;
    const item = new THREE.Mesh(
      new THREE.BoxGeometry(gw, gh, 0.11),
      toon(c)
    );
    item.position.set(
      shelfX + 0.02,
      y + 0.02 + gh / 2,
      -4.2 + i * 0.24 + Math.random() * 0.04
    );
    reg(item, 0.012);
  }
}

/* --- 中岛货架 --- */
const islandBase = B(1.9, 0.06, 0.62, 0xc9c4b5);
islandBase.position.set(-3.1, 0.78, -3.0);
reg(islandBase, 0.04);

const islandBase2 = B(1.9, 0.06, 0.62, 0xc9c4b5);
islandBase2.position.set(-3.1, 1.18, -3.0);
reg(islandBase2, 0.04);

const islandLegMat = toon(0x8d94a8);
[-3.9, -3.1, -2.3].forEach(x => {
  const leg = B(0.06, 0.62, 0.06, 0x8d94a8);
  leg.position.set(x, 0.47, -3.0);
  reg(leg, 0.02);
});

const islandColors = [0xff7b72, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xff9f43, 0xffffff];
for (let i = 0; i < 9; i++) {
  const c = islandColors[i % islandColors.length];
  const it = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.16, 0.13), toon(c));
  it.position.set(-3.95 + i * 0.2, 0.90, -3.0 + (i % 2 === 0 ? -0.14 : 0.14));
  reg(it, 0.012);

  const it2 = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.16, 0.13), toon(c));
  it2.position.set(-3.95 + i * 0.2, 1.30, -3.0 + (i % 2 === 0 ? 0.14 : -0.14));
  reg(it2, 0.012);
}

/* --- 收银台 --- */
const counter = B(1.5, 1.0, 0.72, 0xd9d4c4);
counter.position.set(-2.1, 0.70, -1.85);
reg(counter, 0.05);

const counterTop = B(1.6, 0.07, 0.8, 0x8d94a8);
counterTop.position.set(-2.1, 1.23, -1.85);
reg(counterTop, 0.03);

// 收银机
const register = B(0.34, 0.26, 0.3, 0x3d4557);
register.position.set(-1.85, 1.39, -1.9);
reg(register, 0.03);

const regScreen = new THREE.Mesh(
  new THREE.PlaneGeometry(0.26, 0.18),
  glow(0x8fd7ff)
);
regScreen.position.set(-1.85, 1.55, -1.74);
regScreen.rotation.x = -0.25;
reg(regScreen, 0.02);

// 收银台上的小商品
[[-2.45, 1.32, -1.9, 0xff9f43], [-2.62, 1.32, -1.8, 0xff7b72], [-2.8, 1.32, -1.95, 0x4d96ff]]
  .forEach(([x, y, z, c]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 0.1), toon(c));
    m.position.set(x, y, z);
    reg(m, 0.015);
  });

/* --- 窗边杂志架 --- */
const magRack = B(1.5, 0.9, 0.34, 0xb9b4a6);
magRack.position.set(-4.0, 0.62, -1.25);
reg(magRack, 0.04);

for (let i = 0; i < 5; i++) {
  const mag = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.3, 0.02),
    toon([0xff7b72, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xc58bff][i])
  );
  mag.position.set(-4.6 + i * 0.28, 0.92, -1.10);
  mag.rotation.x = -0.16;
  reg(mag, 0.015);
}

/* --- 热食柜 --- */
const hotCase = B(0.85, 0.55, 0.55, 0x3d4557);
hotCase.position.set(-1.55, 1.02, -2.85);
reg(hotCase, 0.03);

const hotGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(0.78, 0.46),
  glow(0xffb85c, { transparent: true, opacity: 0.9 })
);
hotGlow.position.set(-1.55, 1.02, -2.57);
reg(hotGlow, 0.02);

/* =========================================================
   9. 室外道具
   ========================================================= */
/* --- 自动贩卖机 --- */
const vendTex = makeTexture(256, 512, (g, w, h) => {
  g.fillStyle = '#12305a'; g.fillRect(0, 0, w, h);
  // 展示窗
  g.fillStyle = '#0a1830'; g.fillRect(16, 16, w - 32, 300);
  const cols = ['#ff5b5b', '#ffd93d', '#4d96ff', '#6bcb77', '#ff9f43', '#ffffff'];
  for (let r = 0; r < 4; r++) {
    for (let i = 0; i < 5; i++) {
      g.fillStyle = cols[(i + r) % cols.length];
      g.fillRect(26 + i * 42, 36 + r * 72, 30, 52);
    }
    g.fillStyle = '#2a4a7a';
    g.fillRect(16, 96 + r * 72, w - 32, 6);

function makeWire(p1, p2, sag = 0.5) {
  const mid = new THREE.Vector3(
    (p1.x + p2.x) / 2,
    Math.min(p1.y, p2.y) - sag,
    (p1.z + p2.z) / 2
  );
  const curve = new THREE.CatmullRomCurve3([p1, mid, p2]);
  const geo = new THREE.TubeGeometry(curve, 24, 0.018, 5, false);
  const mesh = new THREE.Mesh(geo, toon(0x1e2431));
  mesh.castShadow = false;
  return mesh;
}

/* =========================================================
   10. 雨
   ========================================================= */
const RAIN_COUNT = 1500;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_COUNT * 6);
const rainSpeed = new Float32Array(RAIN_COUNT);

for (let i = 0; i < RAIN_COUNT; i++) {
  const x = (Math.random() - 0.5) * 20;
  const y = Math.random() * 16;
  const z = (Math.random() - 0.5) * 20;
  const len = 0.22 + Math.random() * 0.34;
  rainPos[i * 6 + 0] = x;
  rainPos[i * 6 + 1] = y;
  rainPos[i * 6 + 2] = z;
  rainPos[i * 6 + 3] = x;
  rainPos[i * 6 + 4] = y + len;
  rainPos[i * 6 + 5] = z;
  rainSpeed[i] = 9 + Math.random() * 9;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));

const rainMat = new THREE.LineBasicMaterial({
  color: 0x9ecbff,
  transparent: true,
  opacity: 0.0
});
const rain = new THREE.LineSegments(rainGeo, rainMat);
rain.frustumCulled = false;
scene.add(rain);

/* =========================================================
   11. 组装动画初始化
   ========================================================= */
const tmpBox = new THREE.Box3();

assembly.forEach(({ obj, delay, dur }) => {
  tmpBox.setFromObject(obj);
  const topY = Math.max(tmpBox.max.y, 0.5);
  const rise = topY + 0.6;

  obj.userData.anim = {
    delay: delay + 0.15,
    dur,
    y0: obj.position.y,
    rise
  };
  obj.position.y = obj.position.y - rise;
  obj.visible = false;
});

/* =========================================================
   12. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let rainStarted = false;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // —— 组装动画 ——
  for (const item of assembly) {
    const a = item.obj.userData.anim;
    if (!a) continue;

    const p = THREE.MathUtils.clamp((t - a.delay) / a.dur, 0, 1);
    if (p <= 0) {
      item.obj.visible = false;
      continue;
    }
    item.obj.visible = true;
    const e = 1 - Math.pow(1 - p, 3);           // easeOutCubic
    item.obj.position.y = a.y0 - a.rise * (1 - e);
  }

  // —— 雨 ——
  if (t > 3.6) {
    if (!rainStarted) { rainStarted = true; }
    rainMat.opacity = Math.min(0.36, (t - 3.6) * 0.5);

    const posAttr = rainGeo.attributes.position;
    const arr = posAttr.array;
    for (let i = 0; i < RAIN_COUNT; i++) {
      const dy = rainSpeed[i] * dt;
      arr[i * 6 + 1] -= dy;
      arr[i * 6 + 4] -= dy;
      if (arr[i * 6 + 4] < 0) {
        const y = 16 + Math.random() * 2;
        const len = 0.22 + Math.random() * 0.34;
        arr[i * 6 + 1] = y;
        arr[i * 6 + 4] = y + len;
      }
    }
    posAttr.needsUpdate = true;
  }

  // —— 灯光轻微呼吸 ——
  streetLight.intensity = 22 + Math.sin(t * 2.1) * 1.2;
  inLight.intensity = 14 + Math.sin(t * 1.7) * 0.7;

  controls.update();
  renderer.render(scene, camera);
}

animate();
